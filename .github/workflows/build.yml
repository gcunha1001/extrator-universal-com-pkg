name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (ex.: v1.0.0)"
        required: true
        default: "v1.2.0"
      release_name:
        description: "Nome da release"
        required: false
        default: "Extrator Universal com PKG"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instala PyInstaller
        run: pip install pyinstaller
      - name: Compila (Linux)
        run: >
          pyinstaller --onefile --windowed
          --name extrair-tudo
          --add-data "core.py:."
          --hidden-import tkinterdnd2
          --collect-all tkinterdnd2
          app.py
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/extrair-tudo

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instala PyInstaller
        run: pip install pyinstaller
      - name: Compila (Windows)
        shell: pwsh
        run: >
          pyinstaller --onefile --windowed
          --name extrair-tudo
          --add-data "core.py;."
          --hidden-import tkinterdnd2
          --collect-all tkinterdnd2
          app.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/extrair-tudo.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instala PyInstaller
        run: pip install pyinstaller
      - name: Compila (macOS)
        run: >
          pyinstaller --onefile --windowed
          --name extrair-tudo
          --add-data "core.py:."
          --hidden-import tkinterdnd2
          --collect-all tkinterdnd2
          app.py
      - name: Renomeia binario macOS
        run: mv dist/extrair-tudo dist/extrair-tudo-macos
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/extrair-tudo-macos

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: artifacts/linux
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: artifacts/macos
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.release_name }} ${{ inputs.tag }}
          files: |
            artifacts/linux/extrair-tudo
            artifacts/windows/extrair-tudo.exe
            artifacts/macos/extrair-tudo-macos
